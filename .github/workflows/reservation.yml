name: Desk Reservation Cron

on:
  schedule:
    # Both crons run daily. The check-time gate job below ensures only the one
    # landing at 9 AM Eastern actually proceeds — handling EDT/EST automatically.
    - cron: "1 13 * * 1-5"
    - cron: "1 14 * * 1-5"
  workflow_dispatch:
    inputs:
      user:
        description: 'User to run (enter their email address or "all")'
        required: false
        default: 'all'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-time:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check Eastern time
        id: check
        run: |
          EASTERN_HOUR=$(TZ='America/New_York' date +%H)
          if [ "$EASTERN_HOUR" == "09" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "It is ${EASTERN_HOUR}:xx Eastern — skipping this trigger."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  set-users:
    needs: check-time
    if: needs.check-time.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      users: ${{ steps.set-users.outputs.users }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq

      - name: Fetch users from Google Sheet
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          chmod +x fetch_users.sh
          ./fetch_users.sh ./USER_CONFIGS.json

      - name: Parse users
        id: set-users
        run: |
          USER_CONFIGS=$(cat ./USER_CONFIGS.json)

          ALL_USERS=$(echo "$USER_CONFIGS" | jq -r 'keys[]' | jq -R -s -c 'split("\n")[:-1]')

          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.user }}" ] && [ "${{ github.event.inputs.user }}" != "all" ]; then
            USER="${{ github.event.inputs.user }}"
            if echo "$USER_CONFIGS" | jq -e ".\"$USER\"" > /dev/null 2>&1; then
              echo "users=[\"$USER\"]" >> $GITHUB_OUTPUT
            else
              echo "Error: User '$USER' not found in USER_CONFIGS"
              exit 1
            fi
          else
            echo "users=$ALL_USERS" >> $GITHUB_OUTPUT
          fi

  run-reservation:
    needs: [check-time, set-users]
    if: needs.check-time.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        user: ${{ fromJSON(needs.set-users.outputs.users) }}
      fail-fast: false
      max-parallel: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq

      - name: Run reservation for ${{ matrix.user }}
        env:
          APPSPACE_HOST: ${{ secrets.APPSPACE_HOST }}
          BOOKING_START_UTC: ${{ secrets.BOOKING_START_UTC }}
          BOOKING_END_UTC: ${{ secrets.BOOKING_END_UTC }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          RESERVATION_USER: ${{ matrix.user }}
        continue-on-error: true
        run: |
          chmod +x reserve.sh fetch_users.sh
          ./reserve.sh || {
            echo "::error::Reservation failed for user ${{ matrix.user }}"
            exit 1
          }

      - name: Report failure
        if: failure()
        run: |
          echo "::warning::Reservation job failed for user ${{ matrix.user }}"
          echo "Check logs above for details"
